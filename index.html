<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iklil ♥ Lyin</title>

<style>
:root {
  --ivory: #fffaf3;
  --matcha: #a3b18a;
  --strawberry: #ffb3c1;
  --mocha: #3b2f2f;
  --gold: #d4af37;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Georgia", serif;
}

body {
  background: var(--ivory);
  height: 100vh;
  overflow: hidden;
}

/* ===== INTRO SCREEN ===== */
#intro {
  position: fixed;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #fffaf3, #f7efe7);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 10;
  transition: opacity 1.2s ease;
}

.title {
  font-size: 2.5rem;
  color: var(--mocha);
  letter-spacing: 2px;
}

.heart {
  font-size: 2rem;
  color: var(--strawberry);
  animation: pulse 1.5s infinite;
  margin: 10px 0;
}

.subtitle {
  font-size: 1rem;
  color: var(--matcha);
  margin-top: 10px;
}

button {
  margin-top: 25px;
  padding: 12px 28px;
  border: none;
  border-radius: 30px;
  background: var(--matcha);
  color: white;
  cursor: pointer;
  font-size: 1rem;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  transition: 0.3s;
}

button:hover {
  background: var(--strawberry);
}

/* ===== MAIN PAGE ===== */
#main {
  opacity: 0;
  transform: scale(1.05);
  transition: 1.2s ease;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

.card {
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.4);
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.08);
}

h1 {
  font-size: 2.2rem;
  color: var(--mocha);
}

h2 {
  font-size: 1rem;
  color: var(--matcha);
  margin-top: 10px;
  letter-spacing: 2px;
}

.date {
  margin-top: 15px;
  color: var(--gold);
  font-weight: bold;
}

.tag {
  margin-top: 10px;
  color: var(--strawberry);
}

/* floating petals */
.petal {
  position: absolute;
  top: -10px;
  color: rgba(255,179,193,0.7);
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}
</style>
</head>

<body>

<!-- ===== INTRO ===== -->
<div id="intro">
  <div class="title">Iklil</div>
  <div class="heart">♥</div>
  <div class="title">Lyin</div>

  <div class="subtitle">18 July 2026</div>

  <button onclick="enterSite()">Enter Our Wedding</button>
</div>

<!-- ===== MAIN ===== -->
<div id="main">
  <div class="card">
    <h1>Iklil ♥ Lyin</h1>
    <h2>Every love story is beautiful, but ours is our favourite</h2>
    <div class="date">18 July 2026</div>
    <div class="tag">#IklilForLyin</div>
  </div>
</div>

<!-- ===== MUSIC ===== -->
<audio id="music" loop>
  <source src="assets/music.mp3" type="audio/mp3">
</audio>

<script>
// ===== ENTER FUNCTION =====
function enterSite() {
  const intro = document.getElementById("intro");
  const main = document.getElementById("main");
  const music = document.getElementById("music");

  // fade out intro
  intro.style.opacity = "0";

  setTimeout(() => {
    intro.style.display = "none";
    main.style.opacity = "1";
    main.style.transform = "scale(1)";
    document.body.style.overflow = "auto";
  }, 1000);

  // play music (user interaction allowed)
  music.play().catch(err => {
    console.log("Music blocked until interaction");
  });

  startPetals();
}

// ===== FLOATING PETALS =====
function startPetals() {
  for (let i = 0; i < 20; i++) {
    let petal = document.createElement("div");
    petal.classList.add("petal");
    petal.innerHTML = "🌸";

    petal.style.left = Math.random() * 100 + "vw";
    petal.style.animationDuration = (5 + Math.random() * 5) + "s";
    petal.style.fontSize = (12 + Math.random() * 20) + "px";

    document.body.appendChild(petal);

    setTimeout(() => {
      petal.remove();
    }, 10000);
  }

  setInterval(startPetals, 4000);
}
</script>

</body>
</html>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/supabase.js"></script>
